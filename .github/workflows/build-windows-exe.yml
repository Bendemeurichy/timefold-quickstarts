name: Build Windows executable

# Builds the employee-scheduling app as a portable, native Windows .exe.
# Native images cannot be cross-compiled, so this runs on a Windows runner.
#
# Every successful build creates a new GitHub Release with the zip attached:
#   - a push to the stable branch releases under an automatic tag: win-v0.0.<run number>;
#   - a tag push (win-v*) releases under that tag;
#   - a manual run releases under an automatic tag: win-v0.0.<run number>.
#
# How to use:
#   1. Push your changes to the stable branch of your fork (a release is created automatically).
#      Alternatively, run this workflow manually (Actions tab > "Build Windows executable"
#      > "Run workflow") or push a tag like "win-v1.0".
#   2. Download the zip from the new release on the Releases page. Users unzip it anywhere
#      (no admin rights needed) and double-click start-employee-scheduling.bat.

on:
  workflow_dispatch:
  push:
    branches:
      - stable
    tags:
      - 'win-v*'

permissions:
  contents: write # Needed to attach the zip to a GitHub Release.

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: use-cases/employee-scheduling
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Build native executable
        run: mvn -B package -Dnative -DskipTests

      - name: Package portable zip
        working-directory: .
        shell: pwsh
        run: |
          $runner = Get-ChildItem "use-cases\employee-scheduling\target\*-runner.exe" | Select-Object -First 1
          if (-not $runner) { throw "Native runner .exe not found in target/" }
          $dist = "dist\employee-scheduling"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item $runner.FullName "$dist\employee-scheduling.exe"
          Copy-Item "use-cases\employee-scheduling\packaging\windows\start-employee-scheduling.bat" "$dist\"
          Compress-Archive -Path "$dist\*" -DestinationPath "dist\employee-scheduling-windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: employee-scheduling-windows
          path: dist/employee-scheduling-windows.zip
          retention-days: 30

      - name: Resolve release tag
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME
          } else {
            $tag = "win-v0.0.$env:RUN_NUMBER"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Every successful build pushes a new release with the zip attached.
      - name: Create GitHub Release with the zip
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Employee Scheduling ${{ env.RELEASE_TAG }}
          files: dist/employee-scheduling-windows.zip
