name: Build Windows executable

# Builds the employee-scheduling app as a portable, native Windows .exe.
# Native images cannot be cross-compiled, so this runs on a Windows runner.
#
# How to use:
#   1. Push your changes to your fork.
#   2. Run this workflow manually (Actions tab > "Build Windows executable" > "Run workflow"),
#      or push a tag like "win-v1.0" to also create a GitHub Release with the zip attached.
#   3. Distribute dist/employee-scheduling-windows.zip. Users unzip it anywhere
#      (no admin rights needed) and double-click start-employee-scheduling.bat.

on:
  workflow_dispatch:
  push:
    tags:
      - 'win-v*'

permissions:
  contents: write # Needed to attach the zip to a GitHub Release.

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: use-cases/employee-scheduling
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Build native executable
        run: mvn -B package -Dnative -DskipTests

      - name: Package portable zip
        working-directory: .
        shell: pwsh
        run: |
          $runner = Get-ChildItem "use-cases\employee-scheduling\target\*-runner.exe" | Select-Object -First 1
          if (-not $runner) { throw "Native runner .exe not found in target/" }
          $dist = "dist\employee-scheduling"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item $runner.FullName "$dist\employee-scheduling.exe"
          Copy-Item "use-cases\employee-scheduling\packaging\windows\start-employee-scheduling.bat" "$dist\"
          Compress-Archive -Path "$dist\*" -DestinationPath "dist\employee-scheduling-windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: employee-scheduling-windows
          path: dist/employee-scheduling-windows.zip
          retention-days: 30

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/employee-scheduling-windows.zip
