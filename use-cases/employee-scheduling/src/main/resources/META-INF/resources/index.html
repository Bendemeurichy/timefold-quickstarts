<html lang="nl">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Pauzetoezicht inplannen</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.2/styles/vis-timeline-graph2d.min.css"
          integrity="sha256-svzNasPg1yR5gvEaRei2jg+n4Pc3sVyMUWeS6xRAh6U=" crossorigin="anonymous">
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/webjars/font-awesome/css/all.css"/>
    <style>
        :root {
            --ts-violet-1-rgb: #3E00FF;
            --ts-violet-2-rgb: #3423A6;

            --bs-link-color: var(--ts-violet-1-rgb);
            --bs-link-hover-color: var(--ts-violet-2-rgb);
        }
        .nav-pills {
            --bs-nav-pills-link-active-bg: var(--ts-violet-1-rgb);
        }

        /* Week roster */
        .roster-table {
            table-layout: fixed;
        }
        .roster-table thead th {
            background-color: #f1f3f5;
        }
        .roster-location-cell {
            width: 10rem;
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .roster-chip {
            display: inline-block;
            border-radius: 1rem;
            padding: 0.15rem 0.6rem;
            margin: 0.15rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #212529;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }
        .roster-no-lunch {
            background: repeating-linear-gradient(45deg, #f8f9fa, #f8f9fa 10px, #e9ecef 10px, #e9ecef 20px);
            color: #868e96;
            font-style: italic;
        }
        .roster-legend {
            gap: 0.25rem;
        }

        /* Printable roster: hide everything except the week roster when printing */
        @media print {
            header, #actions, blockquote, #notificationPanel {
                display: none !important;
            }
            .tab-content > .tab-pane {
                display: none !important;
            }
            #rosterPanel {
                display: block !important;
            }
            .roster-week {
                break-inside: avoid;
                box-shadow: none !important;
            }
            .roster-chip, .roster-no-lunch, .roster-table thead th, .roster-location-cell {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<header class="bg-white shadow">
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg mb-3">
            <span class="navbar-brand fw-bold">Planning pauzetoezicht</span>
            <div class="ms-auto">
                <button id="editDataButton" class="btn btn-outline-primary" type="button">
                    <span class="fas fa-edit"></span> Gegevens bewerken
                </button>
            </div>
        </nav>
    </div>
</header>
<main class="container-fluid">
    <div class="sticky-top d-flex justify-content-center align-items-center" aria-live="polite"
         aria-atomic="true">
        <div id="notificationPanel" style="position: absolute; top: .5rem;"></div>
    </div>
    <blockquote>Genereer de optimale pauzetoezichtplanning voor je leerkrachten.
        <span id="info" class="fw-bold"></span></blockquote>

    <div id="actions" class="mb-2">
        <button id="solveButton" type="button" class="btn btn-success">
            <span class="fas fa-play"></span> Oplossen
        </button>
        <button id="stopSolvingButton" type="button" class="btn btn-danger">
            <span class="fas fa-stop"></span> Stop met oplossen
        </button>

        <span id="score" class="score ms-2 fw-bold">Score: ?</span>
        <span id="solvingStatus" class="ms-2 text-muted"></span>
        <button id="printButton" type="button" class="ms-2 btn btn-secondary">
            <span class="fas fa-print"></span> Rooster afdrukken
        </button>

        <div class="float-end">
            <ul class="nav nav-pills" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="rosterTab" data-bs-toggle="tab"
                            data-bs-target="#rosterPanel" type="button" role="tab"
                            aria-controls="rosterPanel" aria-selected="true">Weekrooster
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="byEmployeeTab" data-bs-toggle="tab"
                            data-bs-target="#byEmployeePanel" type="button" role="tab"
                            aria-controls="byEmployeePanel" aria-selected="false">Per leerkracht
                    </button>
                </li>
            </ul>
        </div>
    </div>
    <div class="mb-4 tab-content">
        <div class="tab-pane fade show active" id="rosterPanel" role="tabpanel"
             aria-labelledby="rosterTab"></div>
        <div class="tab-pane fade" id="byEmployeePanel" role="tabpanel" aria-labelledby="byEmployeeTab"></div>
    </div>
</main>

<div class="modal fade" id="editDataModal" tabindex="-1" aria-labelledby="editDataModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="editDataModalLabel">Bewerk de gegevens</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Sluiten"></button>
            </div>
            <div class="modal-body" id="editDataModalContent">
                <!-- Filled in by app.js -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuleren</button>
                <button type="button" class="btn btn-primary" id="generateDataButton">
                    <span class="fas fa-cogs"></span> Rooster genereren
                </button>
            </div>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/webjars/jquery/jquery.min.js"></script>
<script src="/webjars/js-joda/dist/js-joda.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.2/standalone/umd/vis-timeline-graph2d.min.js"
        integrity="sha256-Jy2+UO7rZ2Dgik50z3XrrNpnc5+2PAx9MhL2CicodME=" crossorigin="anonymous"></script>
<script src="/app.js"></script>
</body>
</html>
